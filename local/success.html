<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Welcome — SB Systems · Local</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>:root{--ink:#05080F;--blue:#1F6BFF;--sand:#F4F7FB;--sand-deep:#DDE4EC;--text:#0A0E16;--dim:#566472}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--sand);color:var(--text);line-height:1.6}
.wrap{max-width:780px;margin:0 auto;padding:40px 22px 80px}h1{font-family:'Bricolage Grotesque';font-size:clamp(2rem,6vw,3rem);font-weight:800;line-height:1.05;margin:20px 0 8px}.sub{color:var(--dim);margin-bottom:22px;font-size:1.05rem}
.card{background:#fff;border:1px solid var(--sand-deep);border-radius:16px;padding:22px;margin-bottom:14px}.k{font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:10px}.v{font-weight:600;word-break:break-word}
ol{margin:6px 0 0 20px;color:#2a3644}li{margin:6px 0}.brand{font-family:'Bricolage Grotesque';font-weight:800}.brand span{color:var(--blue)}.err{border-color:#c22a40}</style></head>
<body><div class="wrap"><div class="brand">SB <span>Systems</span> · Local</div><div id="app"><h1>One sec…</h1><p class="sub">Confirming with Stripe.</p></div></div>
<script>
(function(){
  var FN='https://joaqxkymryeggcxfnius.supabase.co/functions/v1/local-welcome'; var app=document.getElementById('app'); var sid=new URLSearchParams(location.search).get('session_id');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  if(!sid){app.innerHTML='<h1>No order here</h1><p class="sub">Open the link from your Stripe receipt.</p>';return;}
  fetch(FN+'?session_id='+encodeURIComponent(sid)).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){
    if(!x.ok) throw new Error(x.j.error||'could not verify');
    var o=x.j, it=o.intake||{}, short=(o.order||'').slice(-8).toUpperCase();
    app.innerHTML='<h1>You’re in.</h1><p class="sub">'+esc(o.plan_name)+' · order '+short+'. SB texts you within one business day to kick off. Here is what we have and what happens next.</p>'
      +'<div class="card"><div class="k">Business</div><div class="v">'+esc(it.business||'—')+'</div><div class="k">Site / Facebook</div><div class="v">'+esc(it.site||'—')+'</div><div class="k">Google listing</div><div class="v">'+esc(it.maps||'we’ll find it')+'</div><div class="k">Phone</div><div class="v">'+esc(o.phone||'—')+'</div><div class="k">Email for the monthly report</div><div class="v">'+esc(o.email||'—')+'</div></div>'
      +'<div class="card"><div class="k">The first 7 days</div><ol><li><b>Day 1:</b> SB texts you. We need your Google review link (we can find it), your logo if you have one, and where your site is hosted.</li><li><b>Day 1–3:</b> your review page, referral page, QR card and text templates go up in your colors.</li><li><b>Day 4–7:</b> your first two guides go live, written from the questions customers ask you. Send us three questions you hear the most.</li><li><b>The 1st of every month:</b> your one-page report lands in your inbox.</li></ol><p style="color:var(--dim);font-size:.95rem;margin-top:10px">Cancel any time from your Stripe receipt. Everything published is yours.</p></div>';
  }).catch(function(err){app.innerHTML='<h1>Hmm.</h1><p class="sub">'+esc(err.message)+'</p><div class="card err"><p style="color:var(--dim)">If you just paid, refresh in a few seconds. If it keeps failing, DM <a href="https://instagram.com/SBdabiggest">@SBdabiggest</a> with your receipt — the payment is recorded and nothing is lost.</p></div>';});
})();
</script></body></html>
