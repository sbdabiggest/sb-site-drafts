<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your beat — Soberbby Beats</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;900&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{ --deep:#04100D; --deeper:#020806; --surface:#0A1F1A; --surface-2:#0D2620; --emerald:#2BD9A4; --emerald-deep:#0E7C5C; --sand:#E9DFC8; --sand-dim:#8FA098; --line:rgba(233,223,200,.13);
         --font-body:"Archivo","Helvetica Neue",sans-serif; --font-display:"Big Shoulders Display","Arial Narrow",sans-serif; --font-mono:"Space Mono","Courier New",monospace; }
  *{box-sizing:border-box} body{margin:0;background:var(--deep);color:var(--sand);font-family:var(--font-body);line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:40px clamp(18px,5vw,56px) 80px}
  .mark{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--sand);margin-bottom:34px}
  .sb{width:36px;height:36px;border:2px solid var(--emerald);border-radius:9px;display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:20px;color:var(--emerald)}
  .brand{font-family:var(--font-display);font-weight:900;font-size:24px;letter-spacing:.06em;text-transform:uppercase} .brand b{color:var(--emerald)}
  h1{font-family:var(--font-display);font-weight:900;font-size:clamp(44px,9vw,84px);line-height:.92;text-transform:uppercase;margin:0 0 10px}
  .sub{color:var(--sand-dim);margin:0 0 24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
  .dl{display:flex;flex-direction:column;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--sand);text-decoration:none;font-weight:600}
  .btn.primary{background:var(--emerald);border-color:var(--emerald);color:var(--deeper)}
  .btn small{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:inherit;opacity:.75}
  .cert{background:var(--sand);color:#0b1512;border-radius:14px;padding:28px;font-family:var(--font-body)}
  .cert h2{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:34px;margin:0 0 4px;letter-spacing:.02em}
  .cert .k{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a5a55;margin-top:14px}
  .cert .v{font-size:17px;font-weight:600}
  .cert .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
  .cert p{font-size:13px;color:#33413d;margin:16px 0 0}
  .muted{color:var(--sand-dim);font-size:14px}
  .err{border-color:#c22a40}
  .print{margin-top:12px}
  @media print{ body{background:#fff;color:#000} .noprint{display:none} .cert{border:1px solid #000} }
  @media (max-width:520px){ .cert .grid{grid-template-columns:1fr} }
</style>
</head>
<body><div class="wrap">
  <a class="mark noprint" href="./"><span class="sb">SB</span><span class="brand">Soberbby <b>Beats</b></span></a>
  <div id="app"><h1>One sec…</h1><p class="sub">Confirming your payment with Stripe.</p></div>
</div>
<script>
(function(){
  var DOWNLOADS_FN = 'https://joaqxkymryeggcxfnius.supabase.co/functions/v1/beats-downloads';
  var app = document.getElementById('app');
  var sid = new URLSearchParams(location.search).get('session_id');
  if (!sid) { app.innerHTML = '<h1>No order here</h1><p class="sub">Open the link from your Stripe receipt, or <a href="./">go back to the beats</a>.</p>'; return; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  fetch(DOWNLOADS_FN + '?session_id=' + encodeURIComponent(sid))
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(x){
      if (!x.ok) throw new Error(x.j.error || 'could not verify the order');
      var o = x.j, d = new Date((o.paid_at||0)*1000);
      var date = d.toISOString().slice(0,10);
      app.innerHTML =
        '<h1>It’s yours.</h1><p class="sub">'+esc(o.beat.title)+' — '+esc(o.tier.name)+'. Links below are live for 60 minutes; your Stripe receipt has the order id if you ever need them again.</p>'
        + '<div class="card"><div class="dl">' + o.downloads.map(function(f, i){ return '<a class="btn'+(i===0?' primary':'')+'" href="'+f.url+'"><span>'+esc(f.title)+'</span><small>download</small></a>'; }).join('') + '</div></div>'
        + '<div class="cert" id="cert"><h2>License certificate</h2><div class="k">Issued by</div><div class="v">Soberbby Beats (Jaden Hogan, Destin, FL)</div>'
        + '<div class="grid">'
        + '<div><div class="k">Licensee</div><div class="v">'+esc(o.name||'—')+'</div></div><div><div class="k">Email</div><div class="v">'+esc(o.email||'—')+'</div></div>'
        + '<div><div class="k">Beat</div><div class="v">'+esc(o.beat.title)+' ('+esc(o.beat.bpm)+' BPM, '+esc(o.beat.key)+')</div></div><div><div class="k">License</div><div class="v">'+esc(o.tier.name)+' — non-exclusive</div></div>'
        + '<div><div class="k">Streams allowed</div><div class="v">'+esc(o.tier.streams)+'</div></div><div><div class="k">Music videos</div><div class="v">'+esc(o.tier.videos)+'</div></div>'
        + '<div><div class="k">Order</div><div class="v" style="font-size:13px;font-family:var(--font-mono)">'+esc(o.order)+'</div></div><div><div class="k">Date</div><div class="v">'+date+'</div></div>'
        + '</div><p>Credit the producer as “(prod. Soberbby)” on every release of this beat. Full terms are in the license agreement PDF above; this certificate plus your Stripe receipt are your proof of license.</p></div>'
        + '<div class="noprint print"><button class="btn" onclick="window.print()">Print / save certificate as PDF</button> <a class="btn" href="./">Back to the beats</a></div>';
    })
    .catch(function(err){ app.innerHTML = '<h1>Hmm.</h1><p class="sub">'+esc(err.message)+'</p><div class="card err"><p class="muted">If you just paid, wait a few seconds and refresh. If it keeps failing, DM <a href="https://instagram.com/SBdabiggest">@SBdabiggest</a> with your Stripe receipt and the files get sent by hand the same day.</p></div>'; });
})();
</script>
</body>
</html>
